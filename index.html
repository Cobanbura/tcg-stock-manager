<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Stock Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
<div class="max-w-3xl mx-auto space-y-6">

    <header class="border-b border-slate-700 pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-indigo-400">TCG Stock Manager</h1>
            <p class="text-xs text-slate-400">Stok Giriş Paneli</p>
        </div>
        <div>
            <select id="game-select" class="bg-slate-800 border border-slate-700 text-slate-200 rounded px-3 py-1 text-sm">
            </select>
        </div>
    </header>

    <section class="bg-slate-800 p-6 rounded-lg border-2 border-dashed border-slate-600 text-center transition-colors duration-200 hover:border-indigo-500 cursor-pointer" id="drop-zone">
        <input type="file" id="csv-file" accept=".csv" class="hidden">
        <div class="space-y-2 pointer-events-none">
            <svg class="mx-auto h-12 w-12 text-slate-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                <path d="M28 8H12a4 4 0 00-4 4v20a4 4 0 004 4h24a4 4 0 004-4V20L28 8z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M28 8v12h12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="text-sm text-slate-300">
                <span class="font-semibold text-indigo-400">CSV dosyasını buraya sürükleyin</span> veya tıklayarak seçin
            </div>
            <p class="text-xs text-slate-500" id="file-name-display">Henüz dosya seçilmedi (.csv)</p>
        </div>
    </section>

    <section id="entry-console" class="bg-slate-800 p-6 rounded-lg border border-slate-700 space-y-4 opacity-50 pointer-events-none transition-opacity duration-300">
        <h2 class="text-lg font-semibold text-indigo-300 border-b border-slate-700 pb-2">Stok Giriş Konsolu</h2>

        <div class="grid grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">1. KART NO</label>
                <input type="text" id="input-card-num" placeholder="Arama yapın..." class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white font-mono focus:border-indigo-500 focus:outline-none">
            </div>

            <div id="finish-wrapper">
                <label class="block text-xs font-semibold text-slate-400 mb-1">2. FINISH</label>
                <select id="select-finish" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white font-mono focus:border-indigo-500 focus:outline-none">
                </select>
            </div>

            <div id="qty-wrapper">
                <label class="block text-xs font-semibold text-slate-400 mb-1" id="qty-label">3. ADET</label>
                <input type="number" id="input-qty" min="1" value="1" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white font-mono focus:border-indigo-500 focus:outline-none">
            </div>
        </div>

        <div id="card-preview" class="p-3 bg-slate-900 rounded border border-slate-700 flex items-center justify-between text-sm">
            <div>
                <span id="preview-title" class="font-bold text-slate-200">Kart Bekleniyor...</span>
                <span id="preview-sku" class="block text-xs font-mono text-slate-400">-</span>
            </div>
            <button id="btn-save-entry" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded text-xs transition">
                KAYDET & DEVAM ET (Enter)
            </button>
        </div>
    </section>

    <section class="flex justify-between items-center bg-slate-800 p-4 rounded-lg border border-slate-700">
        <span id="updated-count" class="text-xs font-mono text-slate-400">Giriş Yapılan Kart Sayısı: 0</span>
        <button id="btn-export" disabled class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-6 rounded text-sm disabled:opacity-50 transition">
            Güncellenmiş CSV'yi İndir
        </button>
    </section>

</div>

<script src="./js/configs/pokemonConfig.js"></script>
<script src="./js/configs/onePieceConfig.js"></script>
<script src="./js/configs/riftboundConfig.js"></script>
<script src="./js/coreEditor.js"></script>

<script>
    const GAME_CONFIGS = {
        pokemon: pokemonConfig,
        onepiece: onePieceConfig,
        riftbound: riftboundConfig
    };

    let editor = null;
    let updatedCounter = 0;
    let currentConfig = GAME_CONFIGS.pokemon;

    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', e => e.preventDefault());

    document.addEventListener('DOMContentLoaded', () => {
        const gameSelect = document.getElementById('game-select');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('csv-file');
        const fileNameDisplay = document.getElementById('file-name-display');
        const entryConsole = document.getElementById('entry-console');
        const cardNumInput = document.getElementById('input-card-num');
        const finishSelect = document.getElementById('select-finish');
        const finishWrapper = document.getElementById('finish-wrapper');
        const qtyLabel = document.getElementById('qty-label');
        const qtyInput = document.getElementById('input-qty');
        const previewTitle = document.getElementById('preview-title');
        const previewSku = document.getElementById('preview-sku');
        const saveBtn = document.getElementById('btn-save-entry');
        const exportBtn = document.getElementById('btn-export');
        const updatedCountText = document.getElementById('updated-count');

        function initGameSelect() {
            gameSelect.innerHTML = "";
            Object.keys(GAME_CONFIGS).forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = GAME_CONFIGS[key].gameName;
                gameSelect.appendChild(opt);
            });
            gameSelect.value = "pokemon";
            updateGameMode();
        }

        function updateGameMode() {
            const selectedKey = gameSelect.value;
            currentConfig = GAME_CONFIGS[selectedKey] || GAME_CONFIGS.pokemon;
            
            if (currentConfig.hasFinishes) {
                finishWrapper.style.display = "block";
                qtyLabel.textContent = "3. ADET";
                finishSelect.innerHTML = "";
                currentConfig.finishes.forEach(finishName => {
                    const option = document.createElement('option');
                    option.value = finishName;
                    option.textContent = finishName;
                    finishSelect.appendChild(option);
                });
            } else {
                finishWrapper.style.display = "none";
                qtyLabel.textContent = "2. ADET";
            }

            if (editor) {
                editor.config = currentConfig;
            }
        }

        gameSelect.addEventListener('change', updateGameMode);

        dropZone.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover'].forEach(eName => {
            dropZone.addEventListener(eName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('border-indigo-500');
            });
        });

        ['dragleave', 'drop'].forEach(eName => {
            dropZone.addEventListener(eName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('border-indigo-500');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                fileInput.files = files;
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            fileNameDisplay.innerText = `Yüklendi: ${file.name}`;
            fileNameDisplay.classList.remove('text-slate-500');
            fileNameDisplay.classList.add('text-emerald-400', 'font-semibold');
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const content = evt.target.result;
                    editor = new TCGStockEditor(content, currentConfig);
                    
                    entryConsole.classList.remove('opacity-50', 'pointer-events-none');
                    entryConsole.classList.add('opacity-100');
                    exportBtn.removeAttribute('disabled');
                    
                    setTimeout(() => cardNumInput.focus(), 100);
                } catch (err) {
                    console.error(err);
                    alert("CSV okuma hatası oluştu.");
                }
            };
            reader.readAsText(file);
        }

        cardNumInput.addEventListener('input', (e) => {
            if (!editor) return;
            const cardNum = e.target.value.trim();
            if (!cardNum) {
                previewTitle.innerText = "Kart Bekleniyor...";
                previewSku.innerText = "-";
                return;
            }

            const results = editor.findCardByNumber(cardNum);
            if (results.length > 0) {
                const matched = results[0].row;
                previewTitle.innerText = matched["Title"] || "";
                previewSku.innerText = matched["Variant SKU"] || "";
            } else {
                previewTitle.innerText = "Kart Bulunamadı";
                previewSku.innerText = "-";
            }
        });

        cardNumInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveEntry(); });
        qtyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveEntry(); });
        saveBtn.addEventListener('click', saveEntry);

        function saveEntry() {
            if (!editor) return;

            const cardNum = cardNumInput.value.trim();
            const finish = currentConfig.hasFinishes ? finishSelect.value : null;
            const qty = parseInt(qtyInput.value || "1", 10);

            const results = editor.findCardByNumber(cardNum);
            if (results.length > 0) {
                const idx = results[0].index;
                editor.updateCardAtIndex(idx, finish, qty);
                
                updatedCounter++;
                updatedCountText.innerText = `Giriş Yapılan Kart Sayısı: ${updatedCounter}`;

                cardNumInput.value = "";
                qtyInput.value = "1";
                previewTitle.innerText = "Kart Bekleniyor...";
                previewSku.innerText = "-";
                cardNumInput.focus();
            } else {
                alert("Girdiğiniz arama metnine uygun kart bulunamadı.");
            }
        }

        exportBtn.addEventListener('click', () => {
            if (!editor) return;
            const csvData = editor.exportCSV();
            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentConfig.id}_stock_entries.csv`;
            a.click();
            URL.revokeObjectURL(url);
        });

        initGameSelect();
    });
</script>
</body>
</html>
